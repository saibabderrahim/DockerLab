services:
  frontend:
    image: safa/frontend:v1.0          # built in Step 4
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - frontend-net               # ONLY this network — no path to postgres/redis
    ports:
      - target: 80
        published: 8080
        protocol: tcp
        mode: ingress              # routing mesh: any node answers :8080
    configs:
      - source: nginx_conf
        target: /etc/nginx/nginx.conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

    deploy:
      mode: replicated
      replicas: 30
      placement:
        max_replicas_per_node: 30
        constraints:
          - "node.labels.front==true"
      restart_policy:
        condition: any
















      #update_config:
      #  parallelism: 1
      #  order: start-first

configs:
  nginx_conf:
    file: ./config/nginx.conf

networks:
  frontend-net:
    driver: overlay
    attachable: true